name: ci
on:
  push: { branches: [main] }
  pull_request:

# 约定: 这个文件里不写具体命令, 只负责"准备环境 + 调用 scripts/ci/ 下的脚本"。
# 原因 —— 命令写在 workflow 里就只能在 GitHub 上跑, 本机无法复现;
# 下沉成脚本后, 本机 (make lint / make test) 与 CI 执行的是同一份文件。
# 见 docs/adr/ADR-005-pin-lint-toolchain.md。

jobs:
  # lint 与 engine 必须是两个 job, 不能是同一个 job 的两步 (W5 修):
  # mypy 要检查 apps/api 就得装 fastapi / sqlalchemy / httpx / asyncpg,
  # 而 engine job 的立身之本恰恰是**装不到这些** —— 那份贫瘠就是"单元档真的离线"
  # 这个保证本身。同一个 job 里 pip install 会跨步骤留下, lint 装完就把 engine
  # 的贫瘠污染掉了, 于是"单元档不许连库连网"这条约定再也没有东西守得住。
  lint:
    name: ruff + mypy (全仓静态检查)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash scripts/ci/lint.sh

  engine:
    name: policy_engine + device-sim + evals 离线档 (纯函数, 秒级)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash scripts/ci/test-unit.sh

  api:
    # 这个 job 还兼跑 evals/runner/tests (需要 httpx / asyncpg 的那批, 见 test-api.sh)
    name: api (带真实 Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SENTINEL_TEST_DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash scripts/ci/test-api.sh

  docker:
    name: 镜像可构建 (面试官一键复现的前提)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api device-sim

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build

  # W5+: eval 回归 (record-replay, 零 token 成本), prompt_injection 拦截率 100% 为红线
