name: ci
on:
  push: { branches: [main] }
  pull_request:

# 约定: 这个文件里不写具体命令, 只负责"准备环境 + 调用 scripts/ci/ 下的脚本"。
# 原因 —— 命令写在 workflow 里就只能在 GitHub 上跑, 本机无法复现;
# 下沉成脚本后, 本机 (make lint / make test) 与 CI 执行的是同一份文件。
# 见 docs/adr/ADR-005-pin-lint-toolchain.md。

jobs:
  # lint 与 engine 必须是两个 job, 不能是同一个 job 的两步 (W5 修):
  # mypy 要检查 apps/api 就得装 fastapi / sqlalchemy / httpx / asyncpg,
  # 而 engine job 的立身之本恰恰是**装不到这些** —— 那份贫瘠就是"单元档真的离线"
  # 这个保证本身。同一个 job 里 pip install 会跨步骤留下, lint 装完就把 engine
  # 的贫瘠污染掉了, 于是"单元档不许连库连网"这条约定再也没有东西守得住。
  lint:
    name: ruff + mypy (全仓静态检查)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash scripts/ci/lint.sh

  engine:
    name: policy_engine + device-sim + evals 离线档 (纯函数, 秒级)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash scripts/ci/test-unit.sh

  api:
    # 这个 job 还兼跑 evals/runner/tests (需要 httpx / asyncpg 的那批, 见 test-api.sh)
    name: api (带真实 Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SENTINEL_TEST_DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash scripts/ci/test-api.sh
      # eval 回归冒烟 (replay, 零 token 成本) + 注入得逞率 0 的硬门槛。
      # SPEC-007 第五节与验收 5 早就定义了它, 但在 W5 收尾之前它只是 ci.yml 里
      # 的一行注释 —— 声明的和执行的不是一回事, 与本轮修的那条躺了四天的检查同形。
      # 挂在 api job 是因为 runner 走 HTTP: 要真 Postgres、要 httpx/asyncpg,
      # engine job 三样都没有而且故意没有 (见脚本头部注释)。
      - run: bash scripts/ci/test-eval-smoke.sh

  docker:
    # W6 从"只 build"改成"起生产形态跑断言" (SPEC-009 第四节): 只 build 拦得住
    # 快炸, 拦不住 W4 seed CSV 那种慢炸 —— build 全绿、容器起得来, 有人点到才断。
    # 断言与本机验收是同一份脚本; 起的是 prod 覆盖层, 端口收回/Caddy/SSE/1GB
    # mem_limit 一起验。
    name: 生产 compose 起容器跑断言 (镜像可构建且真能跑)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/test-docker.sh

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # 原来写的是 `npm ci || npm install` —— lock 与 package.json 不一致时
      # npm ci 失败后**静默回退**, 锁文件漂移永远不会红, 等于没锁 (W5 收尾去掉)。
      # 去掉之前实测过: 拿 package.json + package-lock.json 到空目录裸跑 npm ci,
      # 退出码 0, 96 个包 —— 锁文件是同步的, 这一个字符去得起。
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

