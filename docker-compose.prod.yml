# 生产形态覆盖层 (SPEC-009 第一节)。用法:
#
#   SENTINEL_JWT_SECRET=<真密钥> docker compose \
#       -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 将来开机器跑的是同一份文件、同一份镜像 (SPEC-009 目标 1), 不另抄一套。
# 覆盖层做四件事 (SPEC 定的), 外加 1 GB 内存限制:
#   1. 撤掉 db/api/web 的宿主机端口 —— 注意 `ports` 在 compose 合并时是**追加**
#      不是替换, 空列表等于什么都没撤; `!override` 标签 (Compose v2.24+) 才是
#      真正的"替换成空"。CI 的 docker job 会逐个数宿主机端口, 断言只有 80/443
#      (W6 第二段易错点一: "看起来撤了、其实没撤"和没写是一模一样的);
#   2. 加 caddy 占 80/443, 反代 /api/* -> api、其余 -> web (deploy/Caddyfile);
#   3. 注入生产环境变量 (environment=production 触发 SPEC-004 的两道闸:
#      默认 JWT 密钥拒绝启动、会话 cookie 加 Secure);
#   4. 重启策略 unless-stopped (单实例, 进程挂了 docker 拉起来就是全部的自愈)。
#
# 内存: Lightsail Micro 整机 1 GB, 但 1 GB 是**整台机器**的, 不是容器组的 ——
# 内核、dockerd、sshd、每日重置的 cron 进程 (python + device-sim 回放) 都在
# 容器外。mem_limit 是上限不是预留, 合计定成整机内存的话, 容器涨到各自上限
# 之前内核 OOM killer 已经先动手 (很可能杀 Postgres), 这套限制在实机上就
# 拦不住任何东西。所以合计按 **(整机 1024 − 宿主机开销 ~288) ≈ 736 MiB** 定:
# db 320 + api 320 + caddy 64 + web 32 (SPEC-009 第六节第 4 条; 宿主机开销
# 是估值, 开机那天先 free -m 量空载实测, 对不上就按实测重分 —— runbook 第一节
# 有这一条检查项)。本机验收在这套限制下整跑 —— 它证明"四个容器在各自上限内
# 跑得动", **不证明**"这台 1 GB 的机器跑得动", 后者要等实机。
# **用 mem_limit 不用 deploy.resources.limits.memory**: 后者在非 swarm 的
# `docker compose up` 下不生效, 写错了的表现是"验收全过" —— 已做反向验证:
# 容器内逐页写入超限内存确实被 OOM 杀掉 (退出码 137); 注意纯 bytearray 分配
# 不写页时零页不计 RSS, 拦不住是正常的, 别拿它当"限制没生效"的证据。
services:
  db:
    ports: !override []
    restart: unless-stopped
    mem_limit: 320m

  api:
    ports: !override []
    restart: unless-stopped
    mem_limit: 320m
    environment:
      SENTINEL_ENVIRONMENT: production
      # :? 让 compose 在没给密钥时当场报错说人话, 而不是把默认值带上生产 ——
      # 万一有人显式传了默认值, API 自己的启动闸 (SPEC-004 决策 2) 还会再拒一次。
      SENTINEL_JWT_SECRET: ${SENTINEL_JWT_SECRET:?生产必须显式给 SENTINEL_JWT_SECRET (openssl rand -hex 32), 不接受默认值}
      # 种子照常跑 (演示数据就是产品), 但切成公开演示形态: 写 demo_marker
      # 通行证 (每日重置脚本只认它), 且不种 admin 账号 (SPEC-009 第一节第 5 条)
      SENTINEL_APPLY_DEMO_MARKER: "true"
      # 登录限流按真实来源 IP 数: Caddy 会用客户端地址覆盖 X-Forwarded-For
      # (不透传外来值), 满足 config.py 里"必须由代理覆盖"的前提
      SENTINEL_TRUST_PROXY_HEADERS: "true"

  web:
    ports: !override []
    restart: unless-stopped
    mem_limit: 32m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 证书与内部 CA 落盘, 重启不换证书
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    mem_limit: 64m

volumes:
  caddy_data:
  caddy_config:
