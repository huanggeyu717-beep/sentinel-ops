[pytest]
# 让仓库内的本地包 policy_engine 无需 pip install 就能被测试导入。
#
# 背景: 之前必须先 `pip install -e packages/policy_engine` 才能跑测试, 一旦本机换了
# Python 解释器 (比如 brew 升到 3.14), 那份 editable 安装就失效, 报出的却是
# "ModuleNotFoundError: No module named 'policy_engine'" —— 看着像代码坏了,
# 其实是环境没配好。这类坑不该让每个接手的人踩一次。
#
# CI 里仍然额外做一次 pip install -e, 那是为了验证"这个包本身能被正常打包安装",
# 和这里的导入路径是两件事, 不冲突。
pythonpath = packages/policy_engine

# rootdir 固定在仓库根, 保证从任何目录调用 pytest 行为一致
