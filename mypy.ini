# mypy 配置 —— make lint 与 CI 的第二道静态检查 (ruff 管风格, mypy 管类型)。
#
# 分档策略 (见 ADR-005):
#   应用代码与引擎代码开严格档, 测试代码沿用默认档。
#   理由: 应用代码要被别人读、被 W3 的策略引擎接上去, 类型信息在那里才值钱;
#   测试是用完即弃的胶水代码, 强制标注收益低、噪音大 —— 全仓开严格档时
#   74% 的报错来自测试。
#
# 注意: `strict = True` 只能写在 [mypy] 全局小节, 写进按模块的小节会被当成全局开关,
# 把测试代码一起卷进去。所以这里逐条列出严格档包含的检查项。
#
# 严格档是**逐模块打开**的: 每补完一个模块的标注, 就把它加进下面的白名单。
# 这样任何时刻 make lint 都是绿的, 不会出现"先红一大片, 等以后慢慢还"。
# 截至 2026-08-06, apps/api/app 与 packages 下的模块已全部补完并纳入;
# 新增模块请在补完标注后加进下面的列表, 不要另起小节。
[mypy]
python_version = 3.12

# asyncpg 没有类型标注也没有官方 stubs, 只在 db 边界层与测试夹具里使用;
# 应用主路径走 SQLAlchemy(自带类型), 因此对它放行缺失 stubs, 不装第三方 stubs 包。
[mypy-asyncpg.*]
ignore_missing_imports = True

# ===== 已补完标注、已开严格档的模块 =====
# 新增模块时把模块名加到下面这个列表里 (逗号分隔), 不要另起小节, 免得配置散开。
[mypy-policy_engine.*,scenario.*,app.db,app.main,app.routers.status,app.routers.ingest,app.routers.incidents,app.routers.auth,app.services.device_service,app.services.ingest_service,app.services.incident_service,app.services.auth_service,app.services.rate_limit]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True
check_untyped_defs = True
