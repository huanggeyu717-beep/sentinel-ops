# Alembic 配置。数据库地址不写在这里 —— 由 alembic/env.py 从 app.config 读取,
# 保证"应用连哪个库"和"迁移改哪个库"永远是同一个来源 (单一事实源)。
[alembic]
script_location = alembic

# 让 `alembic` 命令能 import 到 app 包 (命令需在 apps/api 目录下执行)
prepend_sys_path = .

# 新建迁移的文件名: 序号_描述.py, 与已有的 0001/0002 风格一致
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
