[project]
name = "sentinel-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sse-starlette>=2.1",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.2",
  "httpx>=0.27",
  # policy-engine 是仓库内的本地包, 单独安装避免依赖非标准的相对路径语法:
  #   pip install -e ../../packages/policy_engine
]

[project.optional-dependencies]
# ruff 必须锁死版本: 它的"默认规则集"会随版本变化, 不锁就会出现昨天绿今天红。
# lint 配置统一放在仓库根目录的 ruff.toml, 此处不再重复声明 [tool.ruff]。
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff==0.16.1", "mypy>=1.11"]
