  - {at_s: 5,      kind: sensor_state, device_id: Arduino1, sensor_id: 1, zone_id: 1, state: WET, value: 810}
  - {at_s: 50,     kind: sensor_state, device_id: Arduino1, sensor_id: 1, zone_id: 1, state: DRY, value: 90}
  - {at_s: 80,     kind: sensor_state, device_id: Arduino1, sensor_id: 1, zone_id: 1, state: WET, value: 820}
