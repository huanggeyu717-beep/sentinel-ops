# 评测专用场景: 湿事件梯子 (sensor_state_changed 类策略的通用判别场景)。
#
# 为什么存在: 第一轮准入 8/14 条被打回, 打回原因高度集中 —— cooldown x2//2 与
# window_s ±1/x2 的变异体需要场景里有**落在特定区间的重复触发间隔**, 三个产品
# 场景与 CSV 都凑不齐。与其逐条用例定制场景, 建一个间隔梯子全库复用。
#
# 梯子设计 (间隔 g 能判别冷却 C 当且仅当 g ∈ (C/2, C] 或 (C, 2C]):
# - z1 (s1/s2, Arduino1) 触发间隔序列: 75, 45, 875, 179.5, 220.5, 180.5, 219.5,
#   200, 450, 1500 —— 覆盖 C ∈ {60, 300, 600} 的 /2 与 x2 判别带, 以及
#   window_s ∈ {180} 的 -1 (179.5)、+1 (180.5)、x2 (200) 判别带
#   (湿区间刻意重叠: window 数的是"此刻湿着 + 变湿时刻同窗", 不重叠数不出 2);
# - z2 (s3/s4, Arduino2) 小梯子: 75, 45, 540, 800, 900 —— 服务 zone 2 作用域的用例;
# - z3 (s5, UNKNOWN_DEVICE) 小梯子: 75, 45, 420, 850 —— 服务后场用例;
#   s0 刻意不出现 (它在库存里"从未上报", 用例的 also_accept 论证依赖这一点);
# - t=2400 s4 湿 + t=2450 s1 湿: same_zone 数 1、any_zone 数 2,
#   count_within 变异体的判别点;
# - DRY 事件本身让 to:WET->DRY 变异体可分。
name: eval_wet_ladder
description: 评测用 —— 三个区的湿/干事件按判别性间隔梯子排布, 服务 cooldown/window/count_within/scope 变异体
events:
